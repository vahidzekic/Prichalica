<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pričalica: pričaj joj i ona ponavlja tvoje reči smešnim glasom, kao igračka koja priča. Radi u potpunosti u pregledaču." />
    <title>Pričalica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐹</text></svg>" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="lang" role="group" data-i18n-aria-label="language">
          <button type="button" data-lang="sr">SR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <h1 data-i18n="app.title">Pričalica</h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </header>

      <section class="stage">
        <div id="buddy" class="buddy" data-state="idle">
          <div id="buddy-figure" class="buddy__figure"></div>
          <div class="buddy__shadow"></div>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="meter" aria-hidden="true">
          <div id="meter-fill" class="meter__fill"></div>
          <div id="meter-threshold" class="meter__threshold" hidden></div>
        </div>

        <button id="toggle" class="toggle" type="button" aria-pressed="false"></button>

        <div class="picker">
          <h2 id="voice-label" class="picker__label" data-i18n="voice.label"></h2>
          <div id="voices" class="chips" role="group" aria-labelledby="voice-label"></div>
        </div>

        <div class="picker">
          <h2 id="character-label" class="picker__label" data-i18n="character.label"></h2>
          <div id="characters" class="chips chips--avatars" role="group" aria-labelledby="character-label"></div>
        </div>
      </section>

      <details class="settings">
        <summary data-i18n="settings.title"></summary>

        <label class="field">
          <span><span data-i18n="settings.pitch"></span> <output id="pitch-value" for="pitch"></output></span>
          <input id="pitch" type="range" min="-6" max="6" step="1" />
        </label>

        <label class="field">
          <span><span data-i18n="settings.sensitivity"></span> <output id="sensitivity-value" for="sensitivity"></output></span>
          <input id="sensitivity" type="range" min="6" max="24" step="1" />
          <small data-i18n="settings.sensitivityHint"></small>
        </label>
      </details>

      <footer class="app__footer">
        <p data-i18n="footer.privacy"></p>
        <p data-i18n="footer.license"></p>
      </footer>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
